<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mailing editorial · MIDES Florida</title><link rel="stylesheet" href="assets/css/style.css"><style>
.module-wrap{max-width:1280px;margin:auto;padding:28px 22px 60px}.module-card{background:#fff;border:1px solid var(--line);padding:22px;margin-bottom:18px;box-shadow:var(--shadow)}.module-nav{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}.module-nav a{padding:10px 13px;background:#eef4f8;color:var(--mides-dark);font-weight:800;text-decoration:none;border-radius:7px}.module-nav a.active{background:var(--mides-blue);color:#fff}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.toolbar input,.toolbar select{padding:11px;border:1px solid var(--line);min-width:220px}.notice{padding:11px 14px;margin:12px 0;background:#eef5f9;border-left:4px solid var(--mides-blue);font-weight:700}.notice.error{background:#fff0f0;border-left-color:#c0392b}.auth{max-width:430px;margin:8vh auto;background:#fff;padding:28px;border:1px solid var(--line);box-shadow:var(--shadow)}.auth input{width:100%;box-sizing:border-box;padding:12px;margin:7px 0 12px;border:1px solid var(--line)}.contact-row{display:grid;grid-template-columns:150px 1fr;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}.contact-data span,.contact-data strong{display:block;margin:2px 0}.contact-memberships{font-size:12px;color:var(--muted);margin-top:5px}.calendar{overflow:auto}.cal-head,.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(120px,1fr));min-width:900px}.cal-head span{padding:9px;text-align:center;background:#eef3f6;font-weight:800;border:1px solid var(--line)}.cal-day{min-height:145px;padding:7px;border:1px solid var(--line);background:#fff}.cal-day.outside{background:#f4f6f7;opacity:.55}.cal-day.today{box-shadow:inset 0 0 0 2px var(--mides-blue)}.cal-date{font-weight:900;font-size:12px;margin-bottom:6px}.event{display:block;width:100%;text-align:left;border:0;border-left:5px solid var(--area);background:#f5f8fa;padding:7px;margin:4px 0;border-radius:5px;cursor:pointer}.event strong,.event small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.event strong{font-size:11px}.event small{font-size:10px;color:var(--muted);margin-top:2px}@media(max-width:700px){.contact-row{grid-template-columns:1fr}.module-wrap{padding:18px 12px}}
</style></head><body class="admin-body"><header class="site-header"><div class="brand-wrap"><img class="brand-logo" src="https://www.gub.uy/ministerio-desarrollo-social/sites/ministerio-desarrollo-social/files/styles/documento/public/imagenes/publicaciones/logo_mides.png" alt="MIDES"><div class="brand-divider"></div><div class="brand-name"><strong>PANEL EDITORIAL</strong><span>MIDES Florida</span></div></div><div class="header-module-links"><a class="admin-link" href="index.html">Sala de prensa</a></div></header><main class="module-wrap"><div class="module-card"><p class="eyebrow blue">DISTRIBUCIÓN INSTITUCIONAL</p><h1>Mailing editorial</h1><p class="module-help">Seleccioná listas y comunicados publicados para generar o enviar un mailing.</p><nav class="module-nav"><a href="admin.html">Comunicados</a><a class="active" href="contactos-editorial.html">Contactos</a><a href="mailing-editorial.html">Mailing</a><a href="agenda-editorial.html">Agenda</a><a href="funcionarios.html">Funcionarios</a></nav><div id="gate" class="notice">Ingresá la clave editorial para cargar este módulo.</div><div id="app" hidden><div class="toolbar"><button id="reload">↻ Actualizar</button></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:20px"><section><h2>Listas</h2><div id="lists"></div></section><section><h2>Comunicados publicados</h2><div id="articles"></div><label>Asunto<input id="subject" style="width:100%;padding:11px;margin-top:6px"></label><button id="generate" style="margin-top:12px">Generar mailing</button></section></div><div id="result" class="notice"></div></div></div></main><script src="config.js"></script><script>let key="",lists=[],articles=[];const $=id=>document.getElementById(id);const esc=v=>String(v??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));async function post(a,x={}){const r=await fetch(PRENSA_CONFIG.apiUrl,{method:"POST",body:new URLSearchParams({action:a,key,...x})});const j=await r.json();if(!j.ok)throw Error(j.error||"Error de API");return j}async function load(){try{const [l,c]=await Promise.all([post("listsList"),post("adminList")]);lists=l.items||[];articles=(c.items||[]).filter(x=>x.estado==="Publicado");$("lists").innerHTML=lists.map(x=>'<label style="display:block;padding:8px;border-bottom:1px solid var(--line)"><input type="checkbox" value="'+esc(x.id)+'"> '+esc(x.nombre)+'</label>').join("");$("articles").innerHTML=articles.length?articles.map(x=>'<label style="display:block;padding:8px;border-bottom:1px solid var(--line)"><input type="checkbox" value="'+esc(x.id)+'"> '+esc(x.titulo)+'</label>').join(""):'<p class="empty-state">No hay comunicados publicados.</p>'}catch(e){$("result").textContent="⚠ "+e.message;$("result").className="notice error"}}$("gate").onclick=async()=>{const k=prompt("Contraseña del panel editorial");if(k!=="Ik3r2026")return alert("Contraseña incorrecta.");key=k;$("app").hidden=false;await load()};$("reload").onclick=load;$("generate").onclick=async()=>{try{const ls=[...document.querySelectorAll("#lists input:checked")].map(x=>x.value),as=[...document.querySelectorAll("#articles input:checked")].map(x=>x.value);if(!ls.length||!as.length)throw Error("Seleccioná al menos una lista y un comunicado.");const s=$("subject").value.trim()||"Información institucional MIDES Florida";const a=await post("mailingSave",{asunto:s,listIds:ls.join(","),comunicadoIds:as.join(",")});const url=new URL("mailing.html?id="+encodeURIComponent(a.item.id),location.href).href;const b=await post("mailingSave",{id:a.item.id,asunto:s,listIds:ls.join(","),comunicadoIds:as.join(","),publicUrl:url});$("result").textContent="✓ Mailing generado: "+b.item.destinatarios+" destinatarios. URL: "+b.item.publicUrl}catch(e){$("result").textContent="⚠ "+e.message;$("result").className="notice error"}};</script></body></html>
