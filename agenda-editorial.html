<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agenda editorial · MIDES Florida</title><link rel="stylesheet" href="assets/css/style.css"><style>
.module-wrap{max-width:1280px;margin:auto;padding:28px 22px 60px}.module-card{background:#fff;border:1px solid var(--line);padding:22px;margin-bottom:18px;box-shadow:var(--shadow)}.module-nav{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}.module-nav a{padding:10px 13px;background:#eef4f8;color:var(--mides-dark);font-weight:800;text-decoration:none;border-radius:7px}.module-nav a.active{background:var(--mides-blue);color:#fff}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.toolbar input,.toolbar select{padding:11px;border:1px solid var(--line);min-width:220px}.notice{padding:11px 14px;margin:12px 0;background:#eef5f9;border-left:4px solid var(--mides-blue);font-weight:700}.notice.error{background:#fff0f0;border-left-color:#c0392b}.auth{max-width:430px;margin:8vh auto;background:#fff;padding:28px;border:1px solid var(--line);box-shadow:var(--shadow)}.auth input{width:100%;box-sizing:border-box;padding:12px;margin:7px 0 12px;border:1px solid var(--line)}.contact-row{display:grid;grid-template-columns:150px 1fr;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}.contact-data span,.contact-data strong{display:block;margin:2px 0}.contact-memberships{font-size:12px;color:var(--muted);margin-top:5px}.calendar{overflow:auto}.cal-head,.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(120px,1fr));min-width:900px}.cal-head span{padding:9px;text-align:center;background:#eef3f6;font-weight:800;border:1px solid var(--line)}.cal-day{min-height:145px;padding:7px;border:1px solid var(--line);background:#fff}.cal-day.outside{background:#f4f6f7;opacity:.55}.cal-day.today{box-shadow:inset 0 0 0 2px var(--mides-blue)}.cal-date{font-weight:900;font-size:12px;margin-bottom:6px}.event{display:block;width:100%;text-align:left;border:0;border-left:5px solid var(--area);background:#f5f8fa;padding:7px;margin:4px 0;border-radius:5px;cursor:pointer}.event strong,.event small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.event strong{font-size:11px}.event small{font-size:10px;color:var(--muted);margin-top:2px}@media(max-width:700px){.contact-row{grid-template-columns:1fr}.module-wrap{padding:18px 12px}}
</style></head><body class="admin-body"><header class="site-header"><div class="brand-wrap"><img class="brand-logo" src="https://www.gub.uy/ministerio-desarrollo-social/sites/ministerio-desarrollo-social/files/styles/documento/public/imagenes/publicaciones/logo_mides.png" alt="MIDES"><div class="brand-divider"></div><div class="brand-name"><strong>PANEL EDITORIAL</strong><span>MIDES Florida</span></div></div><div class="header-module-links"><a class="admin-link" href="index.html">Sala de prensa</a></div></header><main class="module-wrap"><div class="module-card"><p class="eyebrow blue">COORDINACIÓN DE COBERTURA</p><h1>Agenda editorial</h1><p class="module-help">Calendario general. Cada actividad aparece con el color correspondiente a su área.</p><nav class="module-nav"><a href="admin.html">Comunicados</a><a class="active" href="contactos-editorial.html">Contactos</a><a href="mailing-editorial.html">Mailing</a><a href="agenda-editorial.html">Agenda</a><a href="funcionarios.html">Funcionarios</a></nav><div id="gate" class="notice">Ingresá la clave editorial para consultar la agenda.</div><div id="app" hidden><div class="toolbar"><button id="prev">‹ Mes anterior</button><strong id="month"></strong><button id="next">Mes siguiente ›</button><button id="today" class="secondary">Hoy</button><span id="count"></span></div><div class="calendar"><div id="head" class="cal-head"></div><div id="grid" class="cal-grid"></div></div><div id="detail" class="module-card" hidden></div></div></div></main><script src="config.js"></script><script>let key="",d=new Date(),items=[];const $=id=>document.getElementById(id);const esc=v=>String(v??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));async function post(a,x={}){const r=await fetch(PRENSA_CONFIG.apiUrl,{method:"POST",body:new URLSearchParams({action:a,key,...x})});const j=await r.json();if(!j.ok)throw Error(j.error||"Error de API");return j}function bounds(){return [new Date(d.getFullYear(),d.getMonth(),1),new Date(d.getFullYear(),d.getMonth()+1,0,23,59,59)]}function iso(x){return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")+"T"+String(x.getHours()).padStart(2,"0")+":"+String(x.getMinutes()).padStart(2,"0")+":00"}function render(){const f=new Date(d.getFullYear(),d.getMonth(),1),start=new Date(f);start.setDate(1-((f.getDay()+6)%7));$("month").textContent=d.toLocaleDateString("es-UY",{month:"long",year:"numeric"}).replace(/^./,x=>x.toUpperCase());$("head").innerHTML=["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"].map(x=>"<span>"+x+"</span>").join("");let html="";for(let i=0;i<42;i++){let day=new Date(start);day.setDate(start.getDate()+i);let ev=items.filter(x=>{let z=new Date(x.inicio);return z.getFullYear()==day.getFullYear()&&z.getMonth()==day.getMonth()&&z.getDate()==day.getDate()});html+='<div class="cal-day '+(day.getMonth()!=d.getMonth()?"outside ":"")+(day.toDateString()==new Date().toDateString()?"today":"")+'><div class="cal-date">'+day.getDate()+'</div>'+ev.map(x=>'<button class="event" style="--area:'+esc(x.color||"#005ca9")+'" onclick="showEvent(\''+esc(x.id)+'\')"><strong>'+esc(new Date(x.inicio).toLocaleTimeString("es-UY",{hour:"2-digit",minute:"2-digit"}))+" · "+esc(x.actividad)+'</strong><small>'+esc(x.area)+" · "+esc(x.lugar)+'</small></button>').join("")+"</div>"}$("grid").innerHTML=html;$("count").textContent=items.length+" actividades"}async function load(){try{const [a,b]=bounds(),r=await post("adminAgendaList",{from:iso(a),to:iso(b)});items=r.items||[];render()}catch(e){$("grid").innerHTML='<p class="empty-state">⚠ '+esc(e.message)+'</p>'}}window.showEvent=id=>{const x=items.find(a=>a.id===id);if(!x)return;const z=$("detail");z.hidden=false;z.innerHTML="<h2>"+esc(x.actividad)+"</h2><p><strong>Área:</strong> "+esc(x.area)+"</p><p><strong>Responsable:</strong> "+esc(x.nombreUsuario)+"</p><p><strong>Horario:</strong> "+esc(new Date(x.inicio).toLocaleString("es-UY"))+" a "+esc(new Date(x.fin).toLocaleTimeString("es-UY",{hour:"2-digit",minute:"2-digit"}))+"</p><p><strong>Lugar:</strong> "+esc(x.lugar)+"</p><p>"+esc(x.descripcion||"")+"</p>"+(x.imagenUrl?'<img style="max-width:100%;max-height:350px" src="'+esc(x.imagenUrl)+'">':"");z.scrollIntoView({behavior:"smooth"})};$("gate").onclick=async()=>{const k=prompt("Contraseña del panel editorial");if(k!=="Ik3r2026")return alert("Contraseña incorrecta.");key=k;$("app").hidden=false;await load()};$("prev").onclick=()=>{d=new Date(d.getFullYear(),d.getMonth()-1,1);load()};$("next").onclick=()=>{d=new Date(d.getFullYear(),d.getMonth()+1,1);load()};$("today").onclick=()=>{d=new Date();load()};</script></body></html>
