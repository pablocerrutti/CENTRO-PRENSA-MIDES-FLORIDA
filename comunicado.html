<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Comunicado del Centro de Prensa MIDES Florida"><title>Comunicado | Centro de Prensa</title><link rel="stylesheet" href="assets/css/style.css"></head>
<body><header class="site-header"><div class="brand-wrap"><img class="brand-logo" src="https://www.gub.uy/ministerio-desarrollo-social/sites/ministerio-desarrollo-social/files/styles/documento/public/imagenes/publicaciones/logo_mides.png" alt="Ministerio de Desarrollo Social"><div class="brand-divider"></div><div><strong>CENTRO DE PRENSA</strong><span>MIDES Florida</span></div></div><a class="admin-link" href="index.html">← Volver</a></header>
<main class="article-main"><article id="article"><p class="eyebrow">COMUNICADO</p><h1 id="title">Cargando…</h1><p class="article-date" id="date"></p><div class="article-placeholder" id="content"></div><div class="download-box"><strong>Material para medios</strong><span>Fotografías · Video · Documento</span></div></article></main>
<script src="config.js"></script><script>
const id=new URLSearchParams(location.search).get("id"),api=window.PRENSA_CONFIG?.apiUrl;
function esc(v){return String(v??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function formatDate(v){if(!v)return "";const d=new Date(v+"T00:00:00");return isNaN(d)?v:d.toLocaleDateString("es-UY",{day:"2-digit",month:"long",year:"numeric"});}
async function load(){if(!api||!id){showError();return}try{const r=await fetch(api+"?action=get&id="+encodeURIComponent(id),{cache:"no-store"}),d=await r.json();if(!d.ok||!d.item){showError();return}const x=d.item;document.title=x.titulo+" | Centro de Prensa";document.getElementById("title").textContent=x.titulo;document.getElementById("date").textContent=formatDate(x.fecha)+" · "+x.tag;document.getElementById("content").innerHTML=esc(x.contenido).replace(/\n/g,"<br>")}catch(e){showError()}}
function showError(){document.getElementById("title").textContent="Comunicado no disponible";document.getElementById("date").textContent="";document.getElementById("content").textContent="El contenido solicitado no está publicado o no se encuentra disponible."}
load();
</script></body></html>
