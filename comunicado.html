<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Comunicado del Centro de Prensa MIDES Florida"><title>Comunicado | Centro de Prensa</title><link rel="stylesheet" href="assets/css/style.css"><style>.article-video-player{display:block;width:100%;max-width:1100px;max-height:620px;border-radius:12px;background:#000;margin:12px auto}.article-media{margin-top:28px}.article-gallery-image{cursor:zoom-in}.media-download{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}.media-download a{display:inline-flex;align-items:center;padding:10px 14px;border:1px solid #d8e0e5;border-radius:8px;text-decoration:none;font-weight:700}</style></head>
<body><header class="site-header"><div class="brand-wrap"><img class="brand-logo" src="https://www.gub.uy/ministerio-desarrollo-social/sites/ministerio-desarrollo-social/files/styles/documento/public/imagenes/publicaciones/logo_mides.png" alt="Ministerio de Desarrollo Social"><div class="brand-divider"></div><div><strong>CENTRO DE PRENSA</strong><span>MIDES Florida</span></div></div><div class="site-module-actions" aria-label="Navegación del sitio">
  <a class="site-home-button" href="index.html">⌂ Volver a inicio</a>
  <a class="site-exit-button" href="https://www.gub.uy/ministerio-desarrollo-social/" target="_blank" rel="noopener" onclick="return confirm('Vas a salir del Centro de Prensa MIDES Florida. ¿Continuar?')">↗ Salir del sitio</a>
</div></header>
<main class="article-main"><article id="article"><p class="eyebrow">COMUNICADO</p><h1 id="title">Cargando…</h1><p class="article-date" id="date"></p><div id="cover"></div><div class="article-placeholder" id="content"></div><section id="media" class="article-media" hidden><div id="gallery" class="article-gallery"></div><div id="video" class="article-video" hidden></div><div id="audio" class="article-audio" hidden></div></section><div class="download-box"><strong>Material para medios</strong><span>Fotografías · Video · Documento</span></div></article></main>
<script src="config.js"></script><script>
const id=new URLSearchParams(location.search).get("id"),api=window.PRENSA_CONFIG?.apiUrl;
function esc(v){return String(v??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function formatDate(v){if(!v)return "";const d=new Date(v+"T00:00:00");return isNaN(d)?v:d.toLocaleDateString("es-UY",{day:"2-digit",month:"long",year:"numeric"});}
function imageHtml(url,cls=""){if(!/^https?:\/\//i.test(url))return "";return '<img class="'+cls+'" src="'+esc(url)+'" alt="Material fotográfico de la actividad" loading="lazy">'}
function videoEmbed(url,fileId){
 try{
  if(fileId)return '<video class="article-video-player" controls preload="metadata" playsinline src="https://drive.google.com/uc?export=download&id='+encodeURIComponent(fileId)+'"></video>';
  const u=new URL(url);let src="";
  if(u.hostname.includes("youtube.com")){const v=u.searchParams.get("v");if(v)src="https://www.youtube.com/embed/"+encodeURIComponent(v)}
  else if(u.hostname==="youtu.be"){src="https://www.youtube.com/embed/"+encodeURIComponent(u.pathname.slice(1))}
  else if(u.hostname.includes("vimeo.com")){const m=u.pathname.match(/\/(\d+)/);if(m)src="https://player.vimeo.com/video/"+m[1]}
  return src?'<iframe src="'+esc(src)+'" title="Video relacionado" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>':"";
 }catch(e){return ""}
}
async function load(){if(!api||!id){showError();return}try{const r=await fetch(api+"?action=get&id="+encodeURIComponent(id),{cache:"no-store"}),d=await r.json();if(!d.ok||!d.item){showError();return}const x=d.item;document.title=x.titulo+" | Centro de Prensa";document.getElementById("title").textContent=x.titulo;document.getElementById("date").textContent=formatDate(x.fecha)+" · "+x.tag;document.getElementById("content").innerHTML=esc(x.contenido).replace(/\n/g,"<br>");
 if(x.fotoPrincipal){document.getElementById("cover").innerHTML=imageHtml(x.fotoPrincipal,"article-cover");}
 const photos=(x.fotos||[]).filter(Boolean);let media=false;
 if(photos.length){document.getElementById("gallery").innerHTML=photos.map(p=>imageHtml(p,"article-gallery-image")).join("");media=true;}
 const ve=videoEmbed(x.videoUrl||"",x.videoDriveFileId||"");if(ve){document.getElementById("video").innerHTML=ve;document.getElementById("video").hidden=false;media=true;} if(x.audioUrl){document.getElementById("audio").innerHTML="<p><strong>Nota de audio</strong></p><audio controls preload=\"metadata\" src=\""+esc(x.audioUrl)+"\"></audio>";document.getElementById("audio").hidden=false;media=true;}
 document.getElementById("media").hidden=!media;
 }catch(e){showError()}}
function showError(){document.getElementById("title").textContent="Comunicado no disponible";document.getElementById("date").textContent="";document.getElementById("content").textContent="El contenido solicitado no está publicado o no se encuentra disponible."}
load();
</script></body></html>
