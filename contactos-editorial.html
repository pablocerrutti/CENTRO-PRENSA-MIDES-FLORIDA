<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contactos editoriales · MIDES Florida</title><link rel="stylesheet" href="assets/css/style.css"><style>
.module-wrap{max-width:1280px;margin:auto;padding:28px 22px 60px}.module-card{background:#fff;border:1px solid var(--line);padding:22px;margin-bottom:18px;box-shadow:var(--shadow)}.module-nav{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}.module-nav a{padding:10px 13px;background:#eef4f8;color:var(--mides-dark);font-weight:800;text-decoration:none;border-radius:7px}.module-nav a.active{background:var(--mides-blue);color:#fff}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.toolbar input,.toolbar select{padding:11px;border:1px solid var(--line);min-width:220px}.notice{padding:11px 14px;margin:12px 0;background:#eef5f9;border-left:4px solid var(--mides-blue);font-weight:700}.notice.error{background:#fff0f0;border-left-color:#c0392b}.auth{max-width:430px;margin:8vh auto;background:#fff;padding:28px;border:1px solid var(--line);box-shadow:var(--shadow)}.auth input{width:100%;box-sizing:border-box;padding:12px;margin:7px 0 12px;border:1px solid var(--line)}.contact-row{display:grid;grid-template-columns:150px 1fr;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}.contact-data span,.contact-data strong{display:block;margin:2px 0}.contact-memberships{font-size:12px;color:var(--muted);margin-top:5px}.calendar{overflow:auto}.cal-head,.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(120px,1fr));min-width:900px}.cal-head span{padding:9px;text-align:center;background:#eef3f6;font-weight:800;border:1px solid var(--line)}.cal-day{min-height:145px;padding:7px;border:1px solid var(--line);background:#fff}.cal-day.outside{background:#f4f6f7;opacity:.55}.cal-day.today{box-shadow:inset 0 0 0 2px var(--mides-blue)}.cal-date{font-weight:900;font-size:12px;margin-bottom:6px}.event{display:block;width:100%;text-align:left;border:0;border-left:5px solid var(--area);background:#f5f8fa;padding:7px;margin:4px 0;border-radius:5px;cursor:pointer}.event strong,.event small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.event strong{font-size:11px}.event small{font-size:10px;color:var(--muted);margin-top:2px}@media(max-width:700px){.contact-row{grid-template-columns:1fr}.module-wrap{padding:18px 12px}}
</style></head><body class="admin-body"><header class="site-header"><div class="brand-wrap"><img class="brand-logo" src="https://www.gub.uy/ministerio-desarrollo-social/sites/ministerio-desarrollo-social/files/styles/documento/public/imagenes/publicaciones/logo_mides.png" alt="MIDES"><div class="brand-divider"></div><div class="brand-name"><strong>PANEL EDITORIAL</strong><span>MIDES Florida</span></div></div><div class="header-module-links"><a class="admin-link" href="index.html">Sala de prensa</a></div></header><main class="module-wrap"><div class="module-card"><p class="eyebrow blue">GESTIÓN EDITORIAL</p><h1>Contactos de prensa</h1><p class="module-help">Fuente: hoja <strong>Contactos</strong>. El correo utilizado es <strong>E-mail 1 - Value</strong>.</p><nav class="module-nav"><a href="admin.html">Comunicados</a><a class="active" href="contactos-editorial.html">Contactos</a><a href="mailing-editorial.html">Mailing</a><a href="agenda-editorial.html">Agenda</a><a href="funcionarios.html">Funcionarios</a></nav><div id="notice" class="notice">Ingresá la clave editorial para cargar los contactos.</div><div id="app" hidden><div class="toolbar"><input id="search" placeholder="Buscar nombre, medio, correo, teléfono o localidad"><button id="refresh">↻ Actualizar</button><button id="all" class="secondary">Seleccionar todos</button><button id="assign">Asignar seleccionados a lista</button><strong id="count">0 contactos</strong></div><div id="list"></div></div></div></main><script src="config.js"></script><script>let key="";let contacts=[];let selected=new Set();const $=id=>document.getElementById(id);const esc=v=>String(v??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));async function post(action,extra={}){const r=await fetch(PRENSA_CONFIG.apiUrl,{method:"POST",body:new URLSearchParams({action,key,...extra})});const d=await r.json();if(!d.ok)throw new Error(d.error||"Error de API");return d}function render(){const q=$("search").value.toLowerCase().trim();const a=contacts.filter(c=>!q||[c.nombreCompleto,c.email,c.medio,c.cargo,c.telefono,c.localidad].join(" ").toLowerCase().includes(q));$("count").textContent=a.length+" contactos";$("list").innerHTML=a.length?a.map(c=>'<article class="contact-row"><label><input type="checkbox" data-id="'+esc(c.id)+'" '+(selected.has(c.id)?"checked":"")+'> Seleccionar</label><div class="contact-data"><strong>'+esc(c.nombreCompleto||c.email)+'</strong><span>'+esc(c.email||"Sin correo")+'</span><span>'+esc(c.medio||"Sin medio")+(c.cargo?" · "+esc(c.cargo):"")+'</span><span>'+esc(c.telefono||"")+(c.localidad?" · "+esc(c.localidad):"")+'</span>'+(c.listas?.length?'<div class="contact-memberships">Listas: '+c.listas.map(esc).join(" · ")+'</div>':"")+'</div></article>').join(""):'<p class="empty-state">No hay contactos para mostrar.</p>';document.querySelectorAll("[data-id]").forEach(x=>x.onchange=()=>{x.checked?selected.add(x.dataset.id):selected.delete(x.dataset.id)})}async function load(){try{const d=await post("contactsList");contacts=d.items||[];render();$("notice").textContent="✓ Contactos sincronizados desde Google Sheets: "+contacts.length;$("notice").className="notice"}catch(e){$("notice").textContent="⚠ "+e.message;$("notice").className="notice error"}}$("notice").onclick=async()=>{if(key)return;const k=prompt("Contraseña del panel editorial");if(k!=="Ik3r2026"){alert("Contraseña incorrecta.");return}key=k;$("app").hidden=false;await load()};$("refresh").onclick=load;$("search").oninput=render;$("all").onclick=()=>{if(selected.size===contacts.length)selected.clear();else contacts.forEach(c=>selected.add(c.id));render()};$("assign").onclick=async()=>{if(!selected.size)return alert("Seleccioná contactos.");const name=prompt("Nombre de la lista");if(!name)return;try{const d=await post("listSave",{nombre:name,descripcion:"Lista creada desde Contactos",estado:"Activa"});await post("contactsAssignList",{contactIds:[...selected].join(","),listId:d.item.id});alert("Contactos asignados correctamente.");await load()}catch(e){alert(e.message)}};</script></body></html>
